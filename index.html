<!DOCTYPE html><html lang="sd" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0d2a5c"><title>ماسٽر اٽي جي چڪي</title>
<style>
:root{--b:#0d2a5c;--l:#eef3fb;--w:#fff}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Naskh Arabic","Noto Sans Arabic",Tahoma,sans-serif;background:var(--l);color:#111;font-size:18px;padding-bottom:76px}
h1{background:var(--b);color:#fff;margin:0;padding:14px;font-size:20px;text-align:center}
main{padding:12px}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--w);border-radius:12px;padding:12px;box-shadow:0 1px 3px #0003;margin-bottom:10px}
.c b{display:block;font-size:22px;color:var(--b)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--b)}
nav button{flex:1;padding:16px 2px;border:0;background:none;color:#cfe;font:inherit;font-size:16px}nav .on{background:#1d4a9c;color:#fff}
input,select{width:100%;padding:12px;font:inherit;border:1px solid #99a;border-radius:8px;margin:4px 0 10px;background:#fff}
.r{display:flex;gap:6px}.r select{width:42%}
button.p,button.s,.seg button{padding:14px;font:inherit;border-radius:10px;border:0;width:100%;margin:4px 0}
button.p{background:var(--b);color:#fff}button.s{background:#dbe5f7;color:var(--b)}
.seg{display:flex;gap:4px;margin-bottom:8px}.seg button{background:#dbe5f7;padding:10px 2px;font-size:16px}.seg .on{background:var(--b);color:#fff}
.h{border-bottom:1px solid #ddd;padding:8px 0;font-size:16px}.h small{color:#556;display:block}
.neg{color:#b00}label{font-size:16px}
</style></head><body><h1>ماسٽر اٽي جي چڪي جو حساب</h1><main id="app"></main>
<nav><button id="n-home" onclick="go('home')">مکيه</button><button id="n-cust" onclick="go('cust')">گراهڪ</button><button id="n-add" onclick="go('add')">داخلو</button><button id="n-bk" onclick="go('bk')">نقل</button></nav>
<script>
const $=s=>document.querySelector(s),TZ='Asia/Karachi';
let db,tab='home',sel=null,et='dep',D={c:[],t:[]};
const open=()=>new Promise((r,j)=>{const q=indexedDB.open('mac',1);q.onupgradeneeded=()=>{q.result.createObjectStore('cust',{keyPath:'id'});q.result.createObjectStore('tx',{keyPath:'id'})};q.onsuccess=()=>{db=q.result;r()};q.onerror=()=>j(q.error)});
const all=s=>new Promise(r=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>r(q.result)});
const put=(s,o)=>new Promise((r,j)=>{const t=db.transaction(s,'readwrite');t.objectStore(s).put(o);t.oncomplete=r;t.onerror=()=>j(t.error)});
const del=(s,k)=>new Promise(r=>{const t=db.transaction(s,'readwrite');t.objectStore(s).delete(k);t.oncomplete=r});
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rd=(x,n=3)=>Math.round(x*10**n)/10**n;
const toKg=(q,u)=>rd(q*(u=='mann'?40:1));
const kk=x=>rd(x)+' ڪلو ('+rd(x/40)+' من)';
const fdt=i=>new Intl.DateTimeFormat('en-GB',{timeZone:TZ,dateStyle:'short',timeStyle:'short'}).format(new Date(i));
const dk=i=>new Intl.DateTimeFormat('en-CA',{timeZone:TZ}).format(new Date(i));
const sum=(a,f)=>a.reduce((s,x)=>s+(f(x)||0),0);
function stock(t){return{w:rd(sum(t,x=>x.type=='dep'?x.kg:0)-sum(t,x=>x.type=='grind'?x.wheat:0)-sum(t,x=>x.type=='del'&&x.prod=='w'?x.kg:0)),
f:rd(sum(t,x=>x.type=='grind'?x.flour:0)-sum(t,x=>x.type=='del'&&x.prod=='f'?x.kg:0)),
b:rd(sum(t,x=>x.type=='grind'?x.bran:0)-sum(t,x=>x.type=='del'&&x.prod=='b'?x.kg:0)),
o:rd(sum(t,x=>x.type=='grind'?x.other:0))}}
function bal(id){const t=D.t.filter(x=>x.cid==id),s=stock(t);return{...s,ch:sum(t,x=>x.type=='grind'?x.charge:0),pd:sum(t,x=>x.type=='pay'?x.amount:0)}}
async function load(){D.c=await all('cust');D.t=(await all('tx')).sort((a,b)=>b.txAt.localeCompare(a.txAt))}
async function go(t){tab=t;sel=null;await load();draw()}
const cname=id=>{const c=D.c.find(x=>x.id==id);return c?esc(c.name)+' ('+c.no+')':'؟'};
const TY={dep:'ڪڻڪ جمع',grind:'پيهڻ',del:'حوالي',pay:'ادائيگي'},PR={w:'ڪڻڪ',f:'اٽو',b:'ڀوسو'};
function detail(x){return x.type=='dep'?kk(x.kg):x.type=='grind'?'ڪڻڪ '+kk(x.wheat)+' ← اٽو '+kk(x.flour)+' + ڀوسو '+kk(x.bran)+(x.other?' + ٻيو '+x.other+' ڪلو':'')+' | فرق: '+kk(rd(x.wheat-x.flour-x.bran-x.other))+' | چارج: '+x.charge+' روپيا':x.type=='del'?PR[x.prod]+' '+kk(x.kg):'رقم: '+x.amount+' روپيا'}
function hist(a){return a.map(x=>`<div class=h><b>${TY[x.type]}</b> - ${cname(x.cid)}<br>${detail(x)}${x.desc?'<br>'+esc(x.desc):''}<small>تاريخ: ${fdt(x.txAt)} | داخل ڪيل: ${fdt(x.entryAt)}</small><button class=s onclick="rm('${x.id}')">حذف ڪريو</button></div>`).join('')||'<p>ڪو داخلو ناهي</p>'}
async function rm(id){if(confirm('ڇا پڪ هي داخلو حذف ڪرڻو آهي؟')){await del('tx',id);await load();draw()}}
function draw(){['home','cust','add','bk'].forEach(k=>$('#n-'+k).className=tab==k?'on':'');
$('#app').innerHTML=tab=='home'?home():tab=='cust'?(sel?cdet():cust()):tab=='add'?addf():bk()}
function home(){const td=dk(new Date()),t=D.t.filter(x=>dk(x.txAt)==td),s=stock(D.t),cd=(a,b)=>`<div class=c>${a}<b>${b}</b></div>`;
return `<div class=g>${cd('اڄ ڪڻڪ آئي',kk(sum(t,x=>x.type=='dep'?x.kg:0)))}${cd('اڄ ڪڻڪ پيهي',kk(sum(t,x=>x.type=='grind'?x.wheat:0)))}${cd('اڄ اٽو ٺهيو',kk(sum(t,x=>x.type=='grind'?x.flour:0)))}${cd('اڄ ڀوسو ٺهيو',kk(sum(t,x=>x.type=='grind'?x.bran:0)))}${cd('اڄ حوالي ڪيو',kk(sum(t,x=>x.type=='del'?x.kg:0)))}${cd('اڄ گراهڪن جي ادائيگي',sum(t,x=>x.type=='pay'?x.amount:0)+' روپيا')}</div>
<div class=c>ذخيرو (ڪل)<br>ڪڻڪ: <b>${kk(s.w)}</b>اٽو: <b>${kk(s.f)}</b>ڀوسو: <b>${kk(s.b)}</b>ٻيو: <b>${s.o} ڪلو</b></div>
<div class=c>ڪل گراهڪ: <b>${D.c.filter(x=>!x.arch).length}</b></div>`}
function cust(){const q=($('#sq')||{}).value||'';return `<button class=p onclick=addC()>+ نئون گراهڪ</button><input id=sq placeholder="نالو يا نمبر ڳوليو" oninput="clist()"><div id=cl>${cl('')}</div>`}
function cl(q){return D.c.filter(c=>!c.arch&&(c.name+c.no+(c.ph||'')).includes(q)).map(c=>{const b=bal(c.id);return `<div class=c onclick="sel='${c.id}';draw()"><b>${esc(c.name)} (${c.no})</b>ڳوٺ: ${esc(c.vil)} | ڪڻڪ باقي: ${kk(b.w)}<br>باقي رقم: ${b.ch-b.pd} روپيا</div>`}).join('')||'<p>ڪو گراهڪ ناهي</p>'}
function clist(){$('#cl').innerHTML=cl($('#sq').value)}
async function addC(unk){const n=D.c.reduce((m,x)=>Math.max(m,x.no),0)+1;let name=unk?'اڻڄاتل '+n:prompt('گراهڪ جو نالو:');if(!name)return;
const c={id:uid('c'),no:n,name,ph:unk?'':prompt('فون نمبر:')||'',vil:unk?'':prompt('ڳوٺ:')||'',made:new Date().toISOString(),temp:!!unk};await put('cust',c);await load();return c}
function cdet(){const c=D.c.find(x=>x.id==sel),b=bal(sel);return `<button class=s onclick="sel=null;draw()">← واپس</button><div class=c><b>${esc(c.name)} (${c.no})</b>فون: ${esc(c.ph)} | ڳوٺ: ${esc(c.vil)}<br>کاتو کليو: ${fdt(c.made)}<hr>ڪڻڪ باقي: ${kk(b.w)}<br>اٽو باقي: ${kk(b.f)}<br>ڀوسو باقي: ${kk(b.b)}<br>پيهائي چارج: ${b.ch} | ادا ڪيل: ${b.pd} | <b class=neg>باقي: ${b.ch-b.pd} روپيا</b></div>
<button class=s onclick=ren()>نالو بدلايو</button><button class=s onclick=arch()>آرڪائيو ڪريو</button>${hist(D.t.filter(x=>x.cid==sel))}`}
async function ren(){const c=D.c.find(x=>x.id==sel),n=prompt('نئون نالو:',c.name);if(n){c.name=n;c.ph=prompt('فون نمبر:',c.ph)||'';c.vil=prompt('ڳوٺ:',c.vil)||'';c.temp=false;await put('cust',c);await load();draw()}}
async function arch(){if(confirm('گراهڪ آرڪائيو ڪجي؟ (رڪارڊ ڪونه ڊهندو)')){const c=D.c.find(x=>x.id==sel);c.arch=1;await put('cust',c);sel=null;await load();draw()}}
const qf=(id,l)=>`<label>${l}</label><div class=r><input id=${id} type=number step=any min=0 inputmode=decimal><select id=${id}u><option value=mann>من</option><option value=kg>ڪلوگرام</option></select></div>`;
function addf(){const cs=D.c.filter(x=>!x.arch);
const f=et=='dep'?qf('q','ڪڻڪ جي مقدار'):et=='grind'?qf('w','ڪڻڪ پيهي')+qf('f','اٽو ٺهيو')+qf('b','ڀوسو ٺهيو')+'<label>ٻيو (ڪلوگرام)</label><input id=o type=number step=any min=0 inputmode=decimal><label>پيهائي جو چارج (روپيا)</label><input id=ch type=number min=0 inputmode=decimal>':et=='del'?'<label>شيءِ</label><select id=pr><option value=f>اٽو</option><option value=w>ڪڻڪ</option><option value=b>ڀوسو</option></select>'+qf('q','مقدار'):'<label>رقم (روپيا)</label><input id=am type=number min=0 inputmode=decimal>';
return `<div class=seg>${Object.keys(TY).map(k=>`<button class="${et==k?'on':''}" onclick="et='${k}';draw()">${TY[k]}</button>`).join('')}</div>
<label>گراهڪ</label><select id=fc>${cs.map(c=>`<option value="${c.id}">${esc(c.name)} (${c.no})</option>`).join('')}</select><button class=s onclick="newU()">+ اڻڄاتل گراهڪ</button>${f}
<label><input type=checkbox id=old style="width:auto" onchange="$('#fd').hidden=!this.checked"> پراڻي تاريخ چونڊيو</label><input id=fd type=datetime-local hidden>
<label>تفصيل</label><input id=fn><button class=p onclick=save()>محفوظ ڪريو</button><small>تاريخ ۽ وقت فون مان پاڻمرادو ٿو وٺجي</small>`}
async function newU(){await addC(1);draw()}
async function save(){const cid=$('#fc').value;if(!cid)return alert('پهرين گراهڪ چونڊيو');
const g=i=>parseFloat($('#'+i)?.value)||0,kg=i=>toKg(g(i),$('#'+i+'u')?.value),now=new Date().toISOString();
let txAt=now;if($('#old').checked){if(!$('#fd').value)return alert('تاريخ چونڊيو');txAt=new Date($('#fd').value).toISOString()}
const t={id:uid('t'),type:et,cid,entryAt:now,txAt,desc:$('#fn').value.trim()},s=stock(D.t),b=bal(cid);
if(et=='dep'){t.kg=kg('q');if(t.kg<=0)return alert('مقدار لکو')}
else if(et=='grind'){Object.assign(t,{wheat:kg('w'),flour:kg('f'),bran:kg('b'),other:rd(g('o')),charge:g('ch')});if(t.wheat<=0)return alert('ڪڻڪ جي مقدار لکو');
if(t.wheat>s.w||t.wheat>b.w)return alert('ڊيڄاريندڙ: ڪڻڪ ڪافي ناهي! ذخيرو: '+kk(s.w)+' | گراهڪ جي باقي: '+kk(b.w));
const d=rd(t.wheat-t.flour-t.bran-t.other);if(d<0&&!confirm('ٺهيل مال ڪڻڪ کان وڌيڪ آهي. ڇا ساڳيو محفوظ ڪجي؟'))return;}
else if(et=='del'){t.prod=$('#pr').value;t.kg=kg('q');if(t.kg<=0)return alert('مقدار لکو');if(t.kg>s[t.prod]||t.kg>b[t.prod])return alert('ڊيڄاريندڙ: ڪافي مال ناهي! ذخيرو: '+kk(s[t.prod])+' | گراهڪ جو باقي: '+kk(b[t.prod]))}
else{t.amount=g('am');if(t.amount<=0)return alert('رقم لکو')}
await put('tx',t);await load();alert('محفوظ ٿي ويو');sel=cid;tab='cust';draw()}
function bk(){return `<button class=p onclick=exp()>نقل محفوظ ڪريو (فائل)</button><label>نقل بحال ڪريو:</label><input type=file accept=".json" onchange="imp(this.files[0])"><p>نقل فائل کي پنهنجي فون ۾ محفوظ رکو. بحال ڪرڻ سان پراڻا رڪارڊ ڪونه ڊهندا، نقلي داخلا ٻيهر نه ٿيندا.</p>`}
function exp(){const b=new Blob([JSON.stringify({v:1,at:new Date().toISOString(),c:D.c,t:D.t})],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='chakki-backup-'+dk(new Date())+'.json';a.click()}
async function imp(f){if(!f)return;try{const j=JSON.parse(await f.text());if(!Array.isArray(j.c)||!Array.isArray(j.t))throw 0;if(!confirm('بحال ڪجي؟'))return;for(const c of j.c)await put('cust',c);for(const t of j.t)await put('tx',t);await load();alert('بحال ٿي ويو');draw()}catch(e){alert('هي فائل صحيح ناهي')}}
open().then(()=>go('home'));
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
</script></body></html>
