<!DOCTYPE html>
<html lang="sd" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b1f3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ماسٽر اٽي چڪي نظام — سجاد خان وساڻ</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='36' fill='%230b1f3a'/%3E%3Ccircle cx='96' cy='84' r='46' fill='none' stroke='%23ffffff' stroke-width='8'/%3E%3Ccircle cx='96' cy='84' r='14' fill='%23f59e0b'/%3E%3Cpath d='M96 44v14M96 110v14M56 84h14M122 84h14' stroke='%23ffffff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%D9%85%D8%A7%D8%B3%D9%BD%D8%B1%20%D8%A7%D9%BD%D9%8A%20%DA%86%DA%AA%D9%8A%20%D9%86%D8%B8%D8%A7%D9%85%22%2C%22short_name%22%3A%22%D9%85%D8%A7%D8%B3%D9%BD%D8%B1%20%DA%86%DA%AA%D9%8A%22%2C%22display%22%3A%22standalone%22%2C%22dir%22%3A%22rtl%22%2C%22lang%22%3A%22sd%22%2C%22background_color%22%3A%22%230b1f3a%22%2C%22theme_color%22%3A%22%230b1f3a%22%7D">
  <style>
    :root {
      --navy: #0b1f3a;
      --navy-mid: #13325b;
      --navy-light: #1e4b85;
      --accent: #2563eb;
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #cbd5e1;
      --success: #047857;
      --success-bg: #ecfdf5;
      --danger: #b91c1c;
      --danger-bg: #fef2f2;
      --warn: #b45309;
      --warn-bg: #fffbeb;
      --shadow: 0 2px 10px rgba(11, 31, 58, 0.08);
      --radius: 14px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0; direction: rtl;
      font-family: 'Noto Naskh Arabic', 'Noto Sans Arabic', 'Droid Arabic Naskh', 'Tahoma', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.65;
    }
    .ltr-num { direction: ltr; unicode-bidi: isolate; display: inline-block; }
    .hidden { display: none !important; }
    .app-header {
      position: sticky; top: 0; z-index: 40;
      background: linear-gradient(135deg, var(--navy), var(--navy-mid));
      color: #ffffff; padding: 12px 14px; box-shadow: 0 3px 12px rgba(0,0,0,0.2);
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .brand-title { margin: 0; font-size: 1.15rem; font-weight: 800; }
    .brand-sub { font-size: 0.85rem; color: #cbd5e1; }
    .status-bar {
      margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px; font-size: 0.84rem; background: rgba(255,255,255,0.12); padding: 6px 10px; border-radius: 10px;
    }
    .pill {
      display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
      border-radius: 999px; font-size: 0.8rem; font-weight: 700;
    }
    .pill-offline { background: #14532d; color: #dcfce7; }
    .pill-online { background: #1e3a8a; color: #dbeafe; }
    .pill-warn { background: var(--warn-bg); color: var(--warn); }
    .pill-success { background: var(--success-bg); color: var(--success); }
    .pill-danger { background: var(--danger-bg); color: var(--danger); }
    .pill-navy { background: #e2e8f0; color: var(--navy); }
    .app-shell { display: flex; min-height: calc(100vh - 96px); }
    .side-nav {
      display: none; width: 245px; background: var(--navy); color: #fff; padding: 12px 10px; flex-shrink: 0;
    }
    .side-nav button {
      width: 100%; text-align: right; background: transparent; border: none; color: #e2e8f0;
      padding: 12px 14px; border-radius: 10px; font-family: inherit; font-size: 1rem;
      font-weight: 600; cursor: pointer; margin-bottom: 4px;
    }
    .side-nav button.active, .side-nav button:hover { background: var(--navy-light); color: #ffffff; }
    .main-content { flex: 1; padding: 14px 12px 92px 12px; max-width: 1120px; margin: 0 auto; width: 100%; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 45; background: var(--navy);
      display: grid; grid-template-columns: repeat(5, 1fr); border-top: 2px solid var(--navy-light);
      box-shadow: 0 -3px 12px rgba(0,0,0,0.18);
    }
    .bottom-nav button {
      background: transparent; border: none; color: #cbd5e1; padding: 12px 4px;
      font-family: inherit; font-size: 0.82rem; font-weight: 700; cursor: pointer;
    }
    .bottom-nav button.active { color: #ffffff; background: var(--navy-light); }
    .section-title {
      margin: 0 0 12px 0; font-size: 1.22rem; color: var(--navy); font-weight: 800;
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px; margin-bottom: 14px; box-shadow: var(--shadow);
    }
    .card-title {
      margin: 0 0 10px 0; font-size: 1.05rem; color: var(--navy); font-weight: 800;
      border-bottom: 1px solid #e2e8f0; padding-bottom: 6px;
    }
    .kpi-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
    .kpi-card {
      background: var(--card); border: 1px solid var(--border); border-right: 5px solid var(--navy);
      border-radius: 12px; padding: 11px 12px; box-shadow: var(--shadow);
    }
    .kpi-card.green { border-right-color: var(--success); }
    .kpi-card.red { border-right-color: var(--danger); }
    .kpi-card.amber { border-right-color: var(--warn); }
    .kpi-label { font-size: 0.84rem; color: var(--muted); font-weight: 700; }
    .kpi-val { font-size: 1.02rem; font-weight: 800; color: var(--navy); margin-top: 3px; }
    .quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 12px 16px; border-radius: 11px; border: none; font-family: inherit;
      font-size: 0.96rem; font-weight: 700; cursor: pointer; min-height: 46px;
    }
    .btn:active { opacity: 0.85; }
    .btn-sm { padding: 7px 11px; min-height: 36px; font-size: 0.86rem; }
    .btn-block { width: 100%; }
    .btn-primary { background: var(--navy); color: #fff; }
    .btn-accent { background: var(--accent); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-warn { background: var(--warn); color: #fff; }
    .btn-outline { background: #fff; color: var(--navy); border: 1.5px solid var(--navy); }
    .btn-light { background: #e2e8f0; color: var(--navy); }
    .form-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-weight: 700; color: var(--navy); font-size: 0.94rem; }
    .form-control, select, textarea {
      width: 100%; padding: 11px 12px; border: 1.5px solid var(--border); border-radius: 10px;
      font-family: inherit; font-size: 1rem; background: #fff; color: var(--text); min-height: 46px;
    }
    .form-control:focus, select:focus {
      outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px rgba(11,31,58,0.12);
    }
    .input-row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 8px; }
    .hint-box {
      background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a;
      padding: 9px 12px; border-radius: 10px; font-size: 0.9rem; font-weight: 600;
    }
    .warn-box {
      background: var(--warn-bg); border: 1px solid #fde68a; color: var(--warn);
      padding: 9px 12px; border-radius: 10px; font-size: 0.92rem; font-weight: 700;
    }
    .danger-box {
      background: var(--danger-bg); border: 1px solid #fecaca; color: var(--danger);
      padding: 9px 12px; border-radius: 10px; font-size: 0.92rem; font-weight: 700;
    }
    .historical-panel {
      background: #f8fafc; border: 1px dashed var(--navy-light); padding: 10px 12px; border-radius: 10px;
    }
    .check-label { display: flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; }
    .check-label input[type="checkbox"] { width: 20px; height: 20px; }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
    th, td { padding: 9px 8px; border-bottom: 1px solid #e2e8f0; text-align: right; vertical-align: top; }
    th { background: #f1f5f9; color: var(--navy); font-weight: 800; white-space: nowrap; }
    .list-card { border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #fff; }
    .list-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
    .list-meta { font-size: 0.88rem; color: var(--muted); }
    .action-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .sub-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .sub-tabs button {
      padding: 8px 13px; border-radius: 10px; border: 1.5px solid var(--navy);
      background: #fff; color: var(--navy); font-family: inherit; font-weight: 700; cursor: pointer;
    }
    .sub-tabs button.active { background: var(--navy); color: #fff; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(11,31,58,0.72); z-index: 100;
      display: flex; align-items: center; justify-content: center; padding: 14px;
    }
    .modal-box {
      background: #fff; border-radius: 16px; width: 100%; max-width: 680px;
      max-height: 90vh; overflow-y: auto; padding: 16px; box-shadow: 0 12px 35px rgba(0,0,0,0.35);
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; margin-bottom: 12px;
    }
    .pin-screen {
      position: fixed; inset: 0; z-index: 200; background: linear-gradient(150deg, var(--navy), #071426);
      color: #fff; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .pin-card {
      background: #fff; color: var(--text); border-radius: 18px; padding: 22px;
      width: 100%; max-width: 380px; text-align: center;
    }
    .toast-wrap {
      position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 150;
      width: calc(100% - 28px); max-width: 440px; display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast {
      padding: 11px 14px; border-radius: 12px; color: #fff; font-weight: 700;
      box-shadow: 0 4px 14px rgba(0,0,0,0.22); text-align: center;
    }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }
    .toast-warn { background: var(--warn); }
    .print-only-header { display: none; }
    @media (min-width: 768px) {
      .kpi-grid { grid-template-columns: repeat(4, 1fr); }
      .quick-grid { grid-template-columns: repeat(4, 1fr); }
      .form-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }
      .side-nav { display: block; }
      .bottom-nav { display: none; }
      .main-content { padding: 20px 24px 36px 24px; }
    }
    @media print {
      .app-header, .side-nav, .bottom-nav, .no-print, .sub-tabs, .toast-wrap, .modal-backdrop { display: none !important; }
      body { background: #fff; color: #000; font-size: 13px; }
      .main-content { padding: 0; max-width: 100%; }
      .card { box-shadow: none; border: 1px solid #999; page-break-inside: avoid; }
      .print-only-header { display: block !important; text-align: center; margin-bottom: 14px; border-bottom: 2px solid #000; padding-bottom: 8px; }
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div>
        <h1 class="brand-title">ماسٽر اٽي چڪي نظام</h1>
        <div class="brand-sub">مالڪ: سجاد خان وساڻ</div>
      </div>
      <div>
        <button id="btnLockNow" class="btn btn-sm btn-light">لاڪ</button>
      </div>
    </div>
    <div class="status-bar">
      <span id="liveClock">—</span>
      <span id="netStatus" class="pill pill-offline">مڪمل آف لائن فعال</span>
    </div>
  </header>

  <div class="app-shell">
    <aside class="side-nav" aria-label="مينو">
      <button data-nav="dashboard" class="active">مکيه صفحو</button>
      <button data-nav="deposit">ڪڻڪ جمع کاتو</button>
      <button data-nav="grinding">پيهائي ۽ پيداوار</button>
      <button data-nav="delivery">مال پهچائڻ</button>
      <button data-nav="customers">گراهڪن جو کاتو</button>
      <button data-nav="workers">مزدور ۽ حاضري</button>
      <button data-nav="cash">آمدني، خرچ ۽ رقم</button>
      <button data-nav="stock">موجود مال جو ذخيرو</button>
      <button data-nav="reports">احوال (رپورٽون)</button>
      <button data-nav="search">مڪمل ڳولا</button>
      <button data-nav="settings">محفوظ نقل ۽ حفاظت</button>
    </aside>

    <main id="mainView" class="main-content"></main>
  </div>

  <nav class="bottom-nav" aria-label="موبائيل مينو">
    <button data-nav="dashboard" class="active">مکيه</button>
    <button data-nav="deposit">ڪڻڪ جمع</button>
    <button data-nav="grinding">پيهائي</button>
    <button data-nav="customers">گراهڪ</button>
    <button data-nav="__MORE__">وڌيڪ</button>
  </nav>

  <div id="modalRoot" class="modal-backdrop hidden"></div>
  <div id="toastWrap" class="toast-wrap"></div>

  <div id="pinLockScreen" class="pin-screen hidden">
    <div class="pin-card">
      <h2 style="margin:0 0 6px 0;color:var(--navy);">ماسٽر اٽي چڪي نظام</h2>
      <p style="margin:0 0 14px 0;color:var(--muted);">سجاد خان وساڻ — ذاتي کاتو</p>
      <form id="pinUnlockForm" class="form-grid">
        <div class="form-group">
          <label>حفاظتي ڪوڊ داخل ڪريو</label>
          <input type="password" inputmode="numeric" dir="ltr" id="pinUnlockInp" class="form-control" style="text-align:center;font-size:1.3rem;" placeholder="••••" required>
        </div>
        <div id="pinErr" style="color:var(--danger);font-weight:700;min-height:22px;"></div>
        <button type="submit" class="btn btn-primary btn-block">کوليو</button>
      </form>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    /* ==================== 1. LOCAL INDEXEDDB ENGINE ==================== */
    const DB_NAME = 'MasterAttaChakkiDB';
    const DB_VERSION = 1;
    const STORES = [
      'meta', 'customers', 'workers', 'deposits', 'grindings',
      'deliveries', 'customerPayments', 'workerAttendance',
      'workerPayments', 'expenses', 'incomes'
    ];
    let dbInstance = null;

    function openDB() {
      if (dbInstance) return Promise.resolve(dbInstance);
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'key' });
          if (!db.objectStoreNames.contains('customers')) {
            const s = db.createObjectStore('customers', { keyPath: 'id' });
            s.createIndex('code', 'code', { unique: true });
            s.createIndex('name', 'name', { unique: false });
          }
          if (!db.objectStoreNames.contains('workers')) {
            const s = db.createObjectStore('workers', { keyPath: 'id' });
            s.createIndex('code', 'code', { unique: true });
            s.createIndex('name', 'name', { unique: false });
          }
          ['deposits', 'grindings', 'deliveries', 'customerPayments'].forEach((n) => {
            if (!db.objectStoreNames.contains(n)) {
              const s = db.createObjectStore(n, { keyPath: 'id' });
              s.createIndex('customerId', 'customerId', { unique: false });
              s.createIndex('txDate', 'txDate', { unique: false });
            }
          });
          if (!db.objectStoreNames.contains('workerAttendance')) {
            const s = db.createObjectStore('workerAttendance', { keyPath: 'id' });
            s.createIndex('workerId', 'workerId', { unique: false });
            s.createIndex('date', 'date', { unique: false });
          }
          if (!db.objectStoreNames.contains('workerPayments')) {
            const s = db.createObjectStore('workerPayments', { keyPath: 'id' });
            s.createIndex('workerId', 'workerId', { unique: false });
            s.createIndex('txDate', 'txDate', { unique: false });
          }
          ['expenses', 'incomes'].forEach((n) => {
            if (!db.objectStoreNames.contains(n)) {
              const s = db.createObjectStore(n, { keyPath: 'id' });
              s.createIndex('txDate', 'txDate', { unique: false });
            }
          });
        };
        req.onsuccess = (e) => {
          dbInstance = e.target.result;
          dbInstance.onversionchange = () => { dbInstance.close(); dbInstance = null; };
          resolve(dbInstance);
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function getAll(storeName) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readonly');
        const req = tx.objectStore(storeName).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function putRecord(storeName, record) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).put(record);
        tx.oncomplete = () => resolve(record);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function deleteRecord(storeName, id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, 'readwrite');
        tx.objectStore(storeName).delete(id);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function setMeta(key, value) {
      return putRecord('meta', { key, value });
    }

    async function nextSequence(metaKey, startAt) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('meta', 'readwrite');
        const store = tx.objectStore('meta');
        const req = store.get(metaKey);
        let nextVal = startAt;
        req.onsuccess = () => {
          const current = req.result ? Number(req.result.value) : startAt;
          nextVal = current;
          store.put({ key: metaKey, value: current + 1 });
        };
        tx.oncomplete = () => resolve(nextVal);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function mergeCustomerRecords(sourceId, targetId) {
      const db = await openDB();
      const childStores = ['deposits', 'grindings', 'deliveries', 'customerPayments'];
      return new Promise((resolve, reject) => {
        const tx = db.transaction(['customers', ...childStores], 'readwrite');
        childStores.forEach((stName) => {
          const store = tx.objectStore(stName);
          const req = store.index('customerId').getAll(sourceId);
          req.onsuccess = () => {
            (req.result || []).forEach((rec) => {
              rec.customerId = targetId;
              store.put(rec);
            });
          };
        });
        tx.objectStore('customers').delete(sourceId);
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function exportAllData() {
      const data = {};
      for (const st of STORES) data[st] = await getAll(st);
      return {
        app: 'MasterAttaChakkiSindhi',
        owner: 'Sajjad Khan Wassan',
        schemaVersion: DB_VERSION,
        exportedAt: new Date().toISOString(),
        stores: data
      };
    }

    async function restoreAllData(backupObj) {
      if (!backupObj || !backupObj.stores || typeof backupObj.stores !== 'object') {
        throw new Error('INVALID_BACKUP');
      }
      for (const st of STORES) {
        if (!Array.isArray(backupObj.stores[st])) throw new Error('MISSING_STORE_' + st);
      }
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORES, 'readwrite');
        STORES.forEach((st) => {
          const store = tx.objectStore(st);
          store.clear();
          backupObj.stores[st].forEach((item) => store.put(item));
        });
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadAllState() {
      const results = await Promise.all(STORES.map((s) => getAll(s)));
      const meta = {};
      results[0].forEach((r) => { meta[r.key] = r.value; });
      return {
        meta,
        customers: results[1],
        workers: results[2],
        deposits: results[3],
        grindings: results[4],
        deliveries: results[5],
        customerPayments: results[6],
        workerAttendance: results[7],
        workerPayments: results[8],
        expenses: results[9],
        incomes: results[10]
      };
    }

    /* ==================== 2. CONSTANTS & STATE ==================== */
    const SINDHI_MONTHS = [
      'جنوري', 'فيبروري', 'مارچ', 'اپريل', 'مئي', 'جون',
      'جولاءِ', 'آگسٽ', 'سيپٽمبر', 'آڪٽوبر', 'نومبر', 'ڊسمبر'
    ];
    const EXPENSE_CATEGORIES = [

    /* ==================== 3. HELPERS & ARITHMETIC ==================== */
    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function uid(prefix) {
      return `${prefix}_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
    }
    function getKarachiNow() {
      const now = new Date();
      try {
        const parts = new Intl.DateTimeFormat('en-GB', {
          timeZone: 'Asia/Karachi', year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
        }).formatToParts(now);
        const map = {};
        parts.forEach((p) => { map[p.type] = p.value; });
        const hour = map.hour === '24' ? '00' : map.hour;
        const date = `${map.year}-${map.month}-${map.day}`;
        const time = `${hour}:${map.minute}`;
        return { iso: now.toISOString(), date, time, fullTime: `${time}:${map.second}` };
      } catch (e) {
        const pkt = new Date(now.getTime() + 5 * 3600 * 1000);
        const pad = (n) => String(n).padStart(2, '0');
        const date = `${pkt.getUTCFullYear()}-${pad(pkt.getUTCMonth() + 1)}-${pad(pkt.getUTCDate())}`;
        const time = `${pad(pkt.getUTCHours())}:${pad(pkt.getUTCMinutes())}`;
        return { iso: now.toISOString(), date, time, fullTime: `${time}:${pad(pkt.getUTCSeconds())}` };
      }
    }
    function formatDateSD(ymd) {
      if (!ymd || !/^\d{4}-\d{2}-\d{2}$/.test(ymd)) return ymd || '—';
      const [y, m, d] = ymd.split('-');
      return `${Number(d)} ${SINDHI_MONTHS[Number(m) - 1] || m} ${y}`;
    }
    function formatTimeSD(hhmm) {
      if (!hhmm) return '';
      const [hStr, mStr] = hhmm.split(':');
      const h = Number(hStr);
      let period = 'صبح';
      if (h >= 12 && h < 17) period = 'منجهند';
      else if (h >= 17 && h < 20) period = 'شام';
      else if (h >= 20 || h < 4) period = 'رات';
      const h12 = h % 12 === 0 ? 12 : h % 12;
      return `${String(h12).padStart(2, '0')}:${mStr} ${period}`;
    }
    function addDaysYMD(ymd, delta) {
      const [y, m, d] = ymd.split('-').map(Number);
      const dt = new Date(Date.UTC(y, m - 1, d + delta));
      const pad = (n) => String(n).padStart(2, '0');
      return `${dt.getUTCFullYear()}-${pad(dt.getUTCMonth() + 1)}-${pad(dt.getUTCDate())}`;
    }
    function toGrams(qty, unit) {
      const n = Number(qty);
      if (!Number.isFinite(n) || n < 0) return 0;
      return unit === 'maund' ? Math.round(n * 40000) : Math.round(n * 1000);
    }
    function fmtNum(n, maxDec = 3) {
      const rounded = Math.round(Number(n) * Math.pow(10, maxDec)) / Math.pow(10, maxDec);
      return rounded.toLocaleString('en-US', { maximumFractionDigits: maxDec });
    }
    function fmtWeightDual(grams) {
      const g = Math.round(Number(grams) || 0);
      const sign = g < 0 ? '-' : '';
      const abs = Math.abs(g);
      const maunds = Math.floor(abs / 40000);
      const remKg = (abs % 40000) / 1000;
      const totalKg = abs / 1000;
      if (abs === 0) return '0 ڪلوگرام';
      if (maunds > 0 && remKg > 0) return `${sign}${maunds} من ${fmtNum(remKg)} ڪلو (${fmtNum(totalKg)} ڪلوگرام)`;
      if (maunds > 0) return `${sign}${maunds} من (${fmtNum(totalKg)} ڪلوگرام)`;
      return `${sign}${fmtNum(totalKg)} ڪلوگرام`;
    }
    function fmtWeightShort(grams) {
      const g = Math.round(Number(grams) || 0);
      const sign = g < 0 ? '-' : '';
      const abs = Math.abs(g);
      const maunds = Math.floor(abs / 40000);
      const remKg = (abs % 40000) / 1000;
      if (abs === 0) return '0 ڪلو';
      if (maunds > 0 && remKg > 0) return `${sign}${maunds} من ${fmtNum(remKg)} ڪلو`;
      if (maunds > 0) return `${sign}${maunds} من`;
      return `${sign}${fmtNum(abs / 1000)} ڪلو`;
    }
    function toPaisa(rupees) {
      const n = Number(rupees);
      return Number.isFinite(n) ? Math.round(n * 100) : 0;
    }
    function fmtMoney(paisa) {
      const p = Math.round(Number(paisa) || 0);
      const formatted = (p / 100).toLocaleString('en-US', {
        minimumFractionDigits: p % 100 === 0 ? 0 : 2, maximumFractionDigits: 2
      });
      return `<span class="ltr-num">${formatted}</span> رپيا`;

    function toast(msg, type = 'success') {

    function confirmModal(title, message) {

    function preventDuplicate(sig) {
      const now = Date.now();
      if (isSubmitting) return true;
      if (sig === lastSubmitSig && now - lastSubmitTs < 4000) return true;
      isSubmitting = true;
      lastSubmitSig = sig;
      lastSubmitTs = now;
      return false;
    }

    async function hashPin(pin, salt) {
      const text = `${salt}:${pin}:MasterChakki`;
      if (window.crypto && window.crypto.subtle) {
        try {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
          return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {}
      }
      let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
      for (let i = 0; i < text.length; i++) {
        const ch = text.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    }

    /* ==================== 4. ACCOUNTING CALCULATIONS ==================== */
    function computeStock() {
      const open = state.meta.openingStock || { wheatGrams: 0, flourGrams: 0, branGrams: 0, otherGrams: 0 };
      let wheat = Number(open.wheatGrams || 0);
      let flour = Number(open.flourGrams || 0);
      let bran = Number(open.branGrams || 0);
      let other = Number(open.otherGrams || 0);
      state.deposits.forEach((d) => { wheat += d.grams; });
      state.grindings.forEach((g) => {
        wheat -= g.wheatGrams; flour += g.flourGrams; bran += g.branGrams; other += g.otherGrams;
      });
      state.deliveries.forEach((dl) => {
        if (dl.product === 'wheat') wheat -= dl.grams;
        else if (dl.product === 'flour') flour -= dl.grams;
        else if (dl.product === 'bran') bran -= dl.grams;
        else other -= dl.grams;
      });
      return { wheat, flour, bran, other };
    }

    function computeCustomerSummary(customerId) {
      let wheatDeposited = 0, wheatProcessed = 0, flourProduced = 0, branProduced = 0;
      let flourDelivered = 0, branDelivered = 0, wheatReturned = 0, otherDelivered = 0;
      let chargesTotal = 0, paymentsTotal = 0;
      state.deposits.forEach((d) => { if (d.customerId === customerId) wheatDeposited += d.grams; });
      state.grindings.forEach((g) => {
        if (g.customerId === customerId) {
          wheatProcessed += g.wheatGrams; flourProduced += g.flourGrams;
          branProduced += g.branGrams; chargesTotal += g.grindingChargesPaisa || 0;
        }
      });
      state.deliveries.forEach((dl) => {
        if (dl.customerId === customerId) {
          if (dl.product === 'flour') flourDelivered += dl.grams;
          else if (dl.product === 'bran') branDelivered += dl.grams;
          else if (dl.product === 'wheat') wheatReturned += dl.grams;
          else otherDelivered += dl.grams;
        }
      });
      state.customerPayments.forEach((p) => { if (p.customerId === customerId) paymentsTotal += p.amountPaisa; });
      return {
        wheatDeposited, wheatProcessed, flourProduced, branProduced,
        flourDelivered, branDelivered, wheatReturned, otherDelivered,
        chargesTotal, paymentsTotal,
        outstandingPaisa: chargesTotal - paymentsTotal,
        remainingWheat: wheatDeposited - wheatProcessed - wheatReturned
      };
    }

    function computeWorkerSummary(workerId, fromDate = null, toDate = null) {
      let presentDays = 0, halfDays = 0, absentDays = 0, earnedPaisa = 0, advancePaidPaisa = 0, wagePaidPaisa = 0;
      const inRange = (d) => (!fromDate || d >= fromDate) && (!toDate || d <= toDate);
      state.workerAttendance.forEach((a) => {
        if (a.workerId === workerId && inRange(a.date)) {
          if (a.status === 'present') presentDays += 1;
          else if (a.status === 'half') halfDays += 1;
          else absentDays += 1;
          earnedPaisa += a.earnedPaisa || 0;
        }
      });
      state.workerPayments.forEach((p) => {
        if (p.workerId === workerId && inRange(p.txDate)) {
          if (p.paymentKind === 'advance') advancePaidPaisa += p.amountPaisa;
          else wagePaidPaisa += p.amountPaisa;
        }
      });
      const totalPaidPaisa = advancePaidPaisa + wagePaidPaisa;
      return {
        presentDays, halfDays, absentDays,
        workingDays: presentDays + halfDays * 0.5,
        earnedPaisa, advancePaidPaisa, wagePaidPaisa, totalPaidPaisa,
        remainingPaisa: earnedPaisa - totalPaidPaisa
      };
    }
